name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "59 1 * * 2"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: python
            build-mode: none
          - language: cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Packages (cpp)
        if: ${{ matrix.language == 'cpp' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-all-dev libgsl-dev libfftw3-dev libatlas-base-dev libopenmpi-dev

      - name: Configure (cpp)
        if: ${{ matrix.language == 'cpp' }}
        run: ./configure --enable-modules=all --disable-asmjit

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      # Must come after init so CodeQL can trace the compiler calls
      - name: Build (cpp)
        if: ${{ matrix.build-mode == 'manual' }}
        run: make -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
