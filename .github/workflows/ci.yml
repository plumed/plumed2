name: CI

on:
  # Pushes run the CI only on master, on the release branches (v2.9, v2.10, ...) and on tags.
  # Other branches of this repository get it through their pull request (open a draft one if the work
  # is not ready), or by hand: Actions > CI > Run workflow, or gh workflow run ci.yml --ref <branch>.
  # Running push CI on every branch meant two full runs (push and pull_request) for each commit of a PR.
  push:
    branches:
      - master
      - 'v2.[0-9]'
      - 'v2.[0-9][0-9]'
    tags:
      - '*'
  pull_request:
    # closed is listed only so that closing or merging a PR starts a run that, through the concurrency
    # group below, cancels the CI still running for it; all the jobs of that run are skipped.
    types: [opened, synchronize, reopened, closed]
  # Nightly run of the whole CI on master. It catches changes in the compilers, runner images and
  # external libraries CI installs on the day they happen, when nothing in PLUMED changed, and it is
  # the run that also performs the regtests marked as long (plumed_long=yes in their config).
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      long_tests:
        description: Also run the long regtests (plumed_long=yes)
        type: boolean
        default: false

# One group per workflow, event and ref, so that the nightly run never waits for a push or vice versa.
# - pull requests, and manual runs on branches other than master: a new run cancels the one in progress;
# - pushes (master, release branches, tags): the run in progress is never cancelled, but runs still
#   waiting are replaced by the newest one, so a burst of merges does not queue one full CI per commit
#   (this was the main source of wall-clock time, with jobs waiting up to 1.5 h for a runner).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master') }}

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2
# these are used to build required packages
  CC: gcc
  CXX: g++

jobs:

# codecheck and checks are quick and run first. In pull requests and manual runs the other jobs start
# only if both pass, so a commit that does not build, is not formatted or breaks the regtests does not
# take the macOS runners and the long Linux builds. Pushes and the nightly run everything anyway, to
# have the full picture (and the doc and coverage pushes) also when something fails.

  codecheck:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/codecheckWF.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  checks:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/checksWF.yml

  linux:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/linuxWF.yml
    secrets: inherit

  windows:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  mac:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/macWF.yml
    secrets: inherit

  python:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/pythonWF.yml
    secrets: inherit

  docker:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/dockerWF.yml
    secrets: inherit

  conda:
    needs: [codecheck, checks]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.codecheck.result == 'success' && needs.checks.result == 'success')) }}
    uses: ./.github/workflows/condaWF.yml
    secrets: inherit
