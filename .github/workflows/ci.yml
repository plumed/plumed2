name: CI

on:
  push:
  pull_request:
  # Nightly run of the whole CI on master. It catches changes in the compilers, runner images and
  # external libraries CI installs on the day they happen, when nothing in PLUMED changed, and it is
  # the run that also performs the regtests marked as long (plumed_long=yes in their config).
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

# One group per workflow, event and ref, so that the nightly run never waits for a push or vice versa.
# - pull requests: a new push cancels the run of the previous one;
# - pushes to a branch (master included): the run in progress is never cancelled, but runs still
#   waiting are replaced by the newest one, so a burst of merges does not queue one full CI per commit
#   (this was the main source of wall-clock time, with jobs waiting up to 1.5 h for a runner).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2
# these are used to build required packages
  CC: gcc
  CXX: g++

jobs:

  linux:
    uses: ./.github/workflows/linuxWF.yml
    secrets: inherit

  codecheck:
    uses: ./.github/workflows/codecheckWF.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  mac:
    uses: ./.github/workflows/macWF.yml
    secrets: inherit

  python:
    uses: ./.github/workflows/pythonWF.yml
    secrets: inherit

  docker:
    uses: ./.github/workflows/dockerWF.yml
    secrets: inherit

  conda:
    uses: ./.github/workflows/condaWF.yml
    secrets: inherit
