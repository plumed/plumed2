name: python tests

on:
  workflow_call:

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2
# these are used to build required packages
  CC: gcc
  CXX: g++

jobs:
  linux-build-plumed:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-python-linux-${{ github.sha }}
        restore-keys: ccache-python-linux-
    - name: setup the CI environment
      uses: ./.github/actions/linux-setup
      with:
        ccache: true

    - name: Build PLUMED
      run: |
        ccache -s -M 100M
        ./configure CXX="ccache $CXX" --enable-boost_serialization --disable-dependency-tracking --enable-modules=all $PLUMED_CONFIG --prefix=$HOME/opt
        make -j 4
        make install
        # check for global symbols, see https://github.com/plumed/plumed2/issues/549
        make nmcheck
        ccache -s -M 100M
    - name: prepare the plumedArtifact
      run: |
        cd $HOME
        tar cf plumed.tar opt/

    - name: Upload the Plumed artifact
      uses: actions/upload-artifact@v6
      with:
        name: plumed-python-linux
        path: ~/plumed.tar
        retention-days: 1

  linux-test-python:
    needs:
    - linux-build-plumed
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pyversion: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
      # still checking out to install the plumed package and to build pycv
    - uses: actions/checkout@v6
    # h5py may need a source build for the newest Python version.
    - name: Install HDF5 development libraries
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libhdf5-dev
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyversion }}
        pip-install: pytest -r ./python/requirements_run.txt

    - name: setup the CI environment
      uses: ./.github/actions/linux-setup
      with:
        export-kernel: true
        # this job only unpacks the plumed built by linux-build-plumed, it does not need the extra space
        free-space: false

    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        path: ~/
        name: plumed-python-linux

    - name: Install plumed
      run: |
          cd $HOME
          tar xf ~/plumed.tar

    - name: Install the python pacakge
      working-directory: ./python
      run: |
         make PLUMED_VERSION
         pip install .
    - name: Run python tests
      working-directory: ./python
      run: |
         pytest -v
    # pycv (toolchain python): one extension for each Python version, against the same base
    - name: Build pycv as an extension and run its tests
      run: |
        python -m pip install -r extensions/requirements.txt "pybind11>=3.0" numpy
        ./configure --with-extension-base="$HOME/opt" --enable-extension-modules=pycv \
          --prefix="$HOME/pycv" PYTHON_BIN=python
        # the base was compiled with CXX="ccache g++" in another job: this one has no ccache
        make CXX="$CXX"
        make install CXX="$CXX"
        grep -qx "variant python${{ matrix.pyversion }}" "$HOME/pycv/lib/plumed/plugins/pycv.plumed"
        export PLUMED_PLUGIN_PATH="$HOME/pycv/lib/plumed/plugins"
        plumed modules -q --has pycv
        make -C regtest/pycv
        .ci/check-module-regtests regtest/pycv
        (cd regtest/pycv/pythontests && python -m pytest -v)
        # PLUMED within a Python of another version (the system Python of the runner):
        # pycv must stop with an error
        if test "$(/usr/bin/python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" != "${{ matrix.pyversion }}" ; then
          (cd regtest/pycv/pythontests && /usr/bin/python3 mismatched_host.py "$HOME/opt/lib/libplumed.so")
        fi
