name: windows-cmake

on:
  workflow_call:

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      # keep LF line endings in the checkout, so that regtest references
      # match the (binary-mode) files written by PLUMED
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUMED_MSVC_DEBUG_INFO=ON

      - name: Build
        run: cmake --build build --parallel

      - name: plumed --version
        run: ./build/plumed.exe info --version

      - name: Smoke test (kt)
        run: ./build/plumed.exe kt --temp 300

      - name: Check embedded thread-MPI availability
        run: ./build/plumed.exe --has-thread-mpi

      - name: Smoke test (embedded thread-MPI)
        run: ./build/plumed.exe --tmpi-threads 2 kt --temp 300

      # Non-blocking for now, see .ci/windows-regtests for the selection.
      # serial: tests without MPI (one in three from regtest/basic)
      - name: Regtests (CLI subset)
        id: regtest
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          TEST_TIMEOUT: 120   # seconds, per test
          TIME_BUDGET: 2400   # seconds, no new test is started after this
        run: .ci/windows-regtests serial

      # MPI tests with the embedded thread-MPI, one at a time
      - name: Regtests (thread-MPI)
        id: regtest-mpi
        if: always() && steps.regtest.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        env:
          TEST_TIMEOUT: 60    # seconds, per test
          TIME_BUDGET: 1500   # seconds, no new test is started after this
        run: .ci/windows-regtests mpi

      # Temporary: stack traces of thread-MPI tests that crash on Windows
      # (all of them use WALKERS_MPI; they pass with the pthread backend on Linux)
      - name: Stack traces of crashing thread-MPI tests
        if: always() && steps.regtest-mpi.outcome != 'skipped'
        continue-on-error: true
        shell: pwsh
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (!(Test-Path $cdb)) {
            "cdb not found at $cdb"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -ErrorAction SilentlyContinue
            exit 0
          }
          $build = "$PWD\build"
          $exe = "$build\plumed.exe"
          $root = $PWD
          function trace($name, $test, $nranks, $arguments) {
            $d = "$root\regtest-results\cdb\$name"
            New-Item -ItemType Directory -Force $d | Out-Null
            Get-ChildItem "$root\regtest\$test" -File | Copy-Item -Destination $d
            Set-Location $d
            & $exe --tmpi-threads $nranks driver @arguments *> plain.log
            "=== $name : exit {0} (0x{0:X8})" -f $LASTEXITCODE
            & $cdb -g -G -y $build -c ".exr -1; .ecxr; kp 40; ~*k 25; q" $exe --tmpi-threads $nranks driver @arguments *> cdb.log
            Get-Content cdb.log | Select-Object -Last 250
            Set-Location $root
          }
          trace 'rt-mpi6b' 'basic\rt-mpi6b' 3 @('--plumed=plumed.dat','--timestep=0.05','--ixyz','trajectory.xyz','--dump-forces','ff','--pdb','test.pdb','--multi','3')
          trace 'rt-bayesgje-2' 'isdb\rt-bayesgje-2' 4 @('--plumed','plumed.dat','--trajectory-stride','1','--timestep','0.005','--ixyz','ala12_trajectory.xyz','--multi','2','--dump-forces','allforce')

      - name: Upload regtest results
        if: always() && steps.regtest.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: windows-regtest-results
          path: regtest-results
