name: windows-cmake

on:
  workflow_call:

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      # keep LF line endings in the checkout, so that regtest references
      # match the (binary-mode) files written by PLUMED
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: plumed --version
        run: ./build/plumed.exe info --version

      - name: Smoke test (kt)
        run: ./build/plumed.exe kt --temp 300

      - name: Check embedded thread-MPI availability
        run: ./build/plumed.exe --has-thread-mpi

      - name: Smoke test (embedded thread-MPI)
        run: ./build/plumed.exe --tmpi-threads 2 kt --temp 300

      # Non-blocking for now: regtests that only need the plumed executable
      # (driver, plumed, sum_hills, simplemd) in the modules built on Windows.
      # "make" tests need Plumed.inc and a Unix toolchain and are not run.
      - name: Regtests (CLI subset)
        id: regtest
        continue-on-error: true
        timeout-minutes: 90
        shell: bash
        run: |
          export PLUMED_PROGRAM_NAME="$PWD/build/plumed.exe"
          cd regtest
          tests=()
          for d in basic core gridtools isdb liquid_crystal multicolvar refdist secondarystructure tools; do
            for t in "$d"/rt*/; do
              t=${t%/}
              [[ -f "$t/config" ]] || continue
              case "$(sed -n 's/^type=//p' "$t/config" | head -n 1)" in
                (driver|plumed|sum_hills|simplemd) tests+=("$t") ;;
              esac
            done
          done
          echo "running ${#tests[@]} tests"
          printf '%s\n' "${tests[@]}" | xargs -P 4 -I{} bash -c 'cd "{}" && ../../scripts/run > /dev/null 2>&1' || true
          ok=0; na=0; deferred=0; failed=()
          for t in "${tests[@]}"; do
            r="$t/report.txt"
            if [[ ! -f "$r" ]]; then failed+=("$t")
            elif grep -q NOT_APPLICABLE "$r"; then ((na++)) || true
            elif grep -q '^DEFERRED (long test' "$r"; then ((deferred++)) || true
            elif grep -q FAILURE "$r"; then failed+=("$t")
            else ((ok++)) || true
            fi
          done
          mkdir -p ../regtest-failures
          for t in "${failed[@]}"; do
            mkdir -p "../regtest-failures/$t"
            cp -r "$t/report.txt" "$t/tmp" "../regtest-failures/$t/" 2>/dev/null || true
          done
          {
            echo "### Windows regtests (CLI subset)"
            echo "passed: $ok, failed: ${#failed[@]}, not applicable: $na, deferred: $deferred"
            for t in "${failed[@]}"; do echo "- $t"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test ${#failed[@]} -eq 0

      - name: Upload failed regtests
        if: steps.regtest.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: windows-regtest-failures
          path: regtest-failures
