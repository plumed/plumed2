name: windows-cmake

on:
  workflow_call:

env:
# on CI, better dump stack trace in case there is an error
  PLUMED_STACK_TRACE: yes
# use two threads for openMP tests
  PLUMED_NUM_THREADS: 2

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      # keep LF line endings in the checkout, so that regtest references
      # match the (binary-mode) files written by PLUMED
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: plumed --version
        run: ./build/plumed.exe info --version

      - name: Smoke test (kt)
        run: ./build/plumed.exe kt --temp 300

      - name: Check embedded thread-MPI availability
        run: ./build/plumed.exe --has-thread-mpi

      - name: Smoke test (embedded thread-MPI)
        run: ./build/plumed.exe --tmpi-threads 2 kt --temp 300

      # Non-blocking for now: regtests that only need the plumed executable
      # (driver, plumed, sum_hills, simplemd) in the modules built on Windows.
      # Not run: "make" tests (they need Plumed.inc and a Unix toolchain) and
      # MPI tests (thread-MPI is covered by the smoke test above).
      # To keep the job short, only one test in three from regtest/basic is run.
      # Each test has its own timeout; tests not started within the time
      # budget are reported as "not run" so that the step always completes.
      - name: Regtests (CLI subset)
        id: regtest
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          TEST_TIMEOUT: 120   # seconds, per test
          TIME_BUDGET: 2400   # seconds, no new test is started after this
        run: |
          export PLUMED_PROGRAM_NAME="$PWD/build/plumed.exe"
          # some tests call "plumed" directly from their config hooks
          export PLUMED_PREPEND_PATH="$PWD/build"
          export DEADLINE=$(( $(date +%s) + TIME_BUDGET ))
          cd regtest
          tests=()
          nbasic=0
          for d in basic gridtools isdb liquid_crystal multicolvar refdist secondarystructure; do
            for t in "$d"/rt*/; do
              t=${t%/}
              [[ -f "$t/config" ]] || continue
              case "$(sed -n 's/^type=//p' "$t/config" | head -n 1)" in
                (driver|plumed|sum_hills|simplemd) ;;
                (*) continue ;;
              esac
              mpiprocs=$(sed -n 's/^mpiprocs=//p' "$t/config" | head -n 1)
              (( ${mpiprocs:-0} > 0 )) && continue
              if [[ $d = basic ]]; then
                (( nbasic++ % 3 == 0 )) || continue
              fi
              tests+=("$t")
            done
          done
          echo "running ${#tests[@]} tests (timeout ${TEST_TIMEOUT}s each, budget ${TIME_BUDGET}s)"

          runone() {
            local t=$1 start rc st
            if (( $(date +%s) > DEADLINE )); then
              echo "NOT_RUN (time budget exhausted)" > "$t/report.txt"
              echo "NOT_RUN  $t"
              return
            fi
            start=$(date +%s)
            ( cd "$t" && timeout -k 10 "$TEST_TIMEOUT" ../../scripts/run > /dev/null 2>&1 )
            rc=$?
            if (( rc == 124 || rc == 137 )); then
              echo "FAILURE: timeout after ${TEST_TIMEOUT}s" >> "$t/report.txt"
              st=TIMEOUT
            elif [[ ! -f "$t/report.txt" ]]; then st=FAIL
            elif grep -q NOT_APPLICABLE "$t/report.txt"; then st=NA
            elif grep -q '^DEFERRED (long test' "$t/report.txt"; then st=DEFERRED
            elif grep -q FAILURE "$t/report.txt"; then st=FAIL
            else st=OK
            fi
            printf '%-8s %-60s %4ds\n' "$st" "$t" $(( $(date +%s) - start ))
          }
          export -f runone
          printf '%s\n' "${tests[@]}" | xargs -P 4 -I{} bash -c 'runone "$1"' _ {} | tee ../regtest-progress.txt || true
          # a timed out test may leave its plumed.exe behind
          taskkill //F //IM plumed.exe > /dev/null 2>&1 || true

          count() { grep -c "^$1 " ../regtest-progress.txt || true; }
          failed=$(grep -E '^(FAIL|TIMEOUT) ' ../regtest-progress.txt | awk '{print $2}' | sort)
          mkdir -p ../regtest-failures
          cp ../regtest-progress.txt ../regtest-failures/
          for t in $failed; do
            mkdir -p "../regtest-failures/$t"
            cp -r "$t/report.txt" "$t/tmp" "../regtest-failures/$t/" 2>/dev/null || true
          done
          {
            echo "### Windows regtests (CLI subset)"
            echo "selected: ${#tests[@]}, passed: $(count OK), failed: $(count FAIL), timed out: $(count TIMEOUT), not applicable: $(count NA), deferred: $(count DEFERRED), not run (time budget): $(count NOT_RUN)"
            echo
            echo "Failures:"
            for t in $failed; do echo "- $t"; done
            echo
            echo "Slowest tests:"
            echo '```'
            grep -vE '^NOT_RUN ' ../regtest-progress.txt | sort -k3 -n -r | head -n 15
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ -z "$failed" ]]

      # Temporary: narrow down the regtests that crash on Windows (rt73 and
      # rt-plumed-action-large-step) and dump the coordinates read from the
      # xtc file of the isdb tests with last-digit differences
      - name: Diagnose Windows-only regtest failures
        if: always() && steps.regtest.outcome != 'skipped'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "$PWD\build\plumed.exe"
          $d = "$PWD\regtest-failures\diag"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item regtest\trajectories\trajectory.xyz, regtest\isdb\rt-baies\trajectory.xtc $d
          Copy-Item regtest\basic\rt-plumed-action-large-step\guest.dat, regtest\basic\rt-plumed-action-large-step\traj.xyz $d
          Set-Location $d
          function run($name, $plumed, $arguments) {
            Set-Content "$name.dat" $plumed
            & $exe driver --plumed "$name.dat" @arguments *> "$name.log"
            "{0,-22} exit {1} (0x{1:X8})" -f $name, $LASTEXITCODE
          }
          $rt73 = Get-Content ..\..\regtest\basic\rt73\plumed.dat
          $a73 = '--trajectory-stride','1','--timestep','0.005','--ixyz','trajectory.xyz'
          run 'rt73-full'      $rt73 $a73
          run 'rt73-no-req'    ($rt73 | Where-Object { $_ -notmatch 'logRequestedAtoms' }) $a73
          run 'rt73-no-act'    ($rt73 | Where-Object { $_ -notmatch 'logActivity' }) $a73
          run 'rt73-no-debug'  ($rt73 | Where-Object { $_ -notmatch '^DEBUG' }) $a73
          run 'rt73-no-end'    ($rt73 | Where-Object { $_ -notmatch 'ENDPLUMED' }) $a73
          $big = Get-Content ..\..\regtest\basic\rt-plumed-action-large-step\plumed.dat
          run 'large-step-3e9'   $big '--ixyz','traj.xyz','--initial-step','3000000000','--timestep','0.001'
          run 'large-step-1e9'   $big '--ixyz','traj.xyz','--initial-step','1000000000','--timestep','0.001'
          run 'xtc-dump' 'DUMPATOMS ATOMS=1-111 FILE=xtc.xyz PRECISION=9' '--mf_xtc','trajectory.xtc'

      - name: Upload regtest results
        if: always() && steps.regtest.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: windows-regtest-results
          path: regtest-failures
