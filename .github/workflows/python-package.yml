name: Python package

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build and validation tools
        run: python -m pip install --upgrade pip build twine

      - name: Prepare package version
        working-directory: python
        run: cp ../VERSION.txt PLUMED_VERSION

      - name: Build wheel and source distribution
        working-directory: python
        run: python -m build --sdist --wheel

      - name: Build a wheel from the source distribution
        working-directory: python
        run: python -m build --wheel dist/*.tar.gz --outdir dist/from-sdist

      - name: Validate distribution metadata
        working-directory: python
        run: python -m twine check dist/*.whl dist/*.tar.gz dist/from-sdist/*.whl

      - name: Install and import the interface wheel
        working-directory: python
        run: |
          python -m pip install --no-deps dist/from-sdist/*.whl
          python -c "import plumed; print(plumed.__file__)"

      - uses: actions/upload-artifact@v6
        with:
          name: python-package-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/plumed
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-dist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
