name: MD integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plumed:
    name: Serial PLUMED (${{ matrix.os }}, OpenMP)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y gawk
          else
            brew install gawk libomp
          fi

      - name: Build a serial kernel with OpenMP
        run: |
          mkdir -p "$RUNNER_TEMP/md-logs"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export CC=gcc CXX=g++ CXXFLAGS='-O2 -fopenmp'
            export LDFLAGS='-fopenmp'
          else
            export CC=/usr/bin/clang CXX=/usr/bin/clang++
            export CXXFLAGS="-O2 -Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
            export LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
          fi
          # Keep the artifact independent of optional libraries on the build
          # runner. OpenMP is enabled explicitly, not merely left to detection.
          ./configure --disable-mpi --disable-libsearch --disable-python \
            --disable-doc --disable-dependency-tracking --prefix="$HOME/plumed-md" \
            2>&1 | tee "$RUNNER_TEMP/md-logs/plumed-configure.log"
          make -j 4 2>&1 | tee "$RUNNER_TEMP/md-logs/plumed-build.log"
          make install 2>&1 | tee "$RUNNER_TEMP/md-logs/plumed-install.log"
          cp config.log Makefile.conf "$RUNNER_TEMP/md-logs/"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # This private prefix is outside the system loader's search path.
            export LD_LIBRARY_PATH="$HOME/plumed-md/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          "$HOME/plumed-md/bin/plumed" config show > "$RUNNER_TEMP/md-logs/plumed-config.txt"
          # Sander does not load OpenMP itself. The kernel must declare its
          # dependencies rather than obtaining them from an OpenMP-enabled MD.
          bash .ci/md-integration/check-kernel.sh "$HOME/plumed-md" \
            2>&1 | tee "$RUNNER_TEMP/md-logs/kernel-load.log"
          # tar preserves executability and symlinks across artifact upload.
          # All jobs of one OS use this same installation prefix.
          tar -C "$HOME" -czf "$RUNNER_TEMP/plumed-md.tar.gz" plumed-md

      - uses: actions/upload-artifact@v6
        with:
          name: plumed-md-${{ matrix.os }}
          path: ${{ runner.temp }}/plumed-md.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Preserve PLUMED build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: md-plumed-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/md-logs
          retention-days: 7

  gromacs:
    needs: plumed
    uses: ./.github/workflows/md-gromacs.yml

  lammps:
    needs: plumed
    uses: ./.github/workflows/md-lammps.yml

  amber:
    needs: plumed
    uses: ./.github/workflows/md-amber.yml
