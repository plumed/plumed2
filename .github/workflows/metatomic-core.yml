name: Metatomic core

on:
  pull_request:

jobs:
  gradients:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Select Python
      run: |
        PYTHON_BIN=$(python -c 'import sys; print(sys.executable)')
        echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
        echo "METATOMIC_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"
    - name: Install dependencies
      run: |
        python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.7' 'metatensor-torch>=0.10.0,<0.11' 'featomic>=0.6.6,<0.7'
        rustup toolchain install 1.88.0 --profile minimal
        RUSTUP_TOOLCHAIN=1.88.0 bash .ci/install.metatomic
    - name: Build PLUMED
      run: |
        PREFIXES=$(python -c 'import pathlib, metatomic.utils, metatensor.utils; print(" ".join(str(pathlib.Path(p).parents[1]) for p in [metatomic.utils.cmake_prefix_path, metatensor.utils.cmake_prefix_path]))')
        for prefix in $PREFIXES; do
          CPPFLAGS="$CPPFLAGS -I$prefix/include -I$prefix/include/metatomic/third-party"
          LDFLAGS="$LDFLAGS -L$prefix/lib -Wl,-rpath,$prefix/lib"
        done
        ./configure --disable-mpi --enable-modules=reset:metatomic --enable-libmetatomic \
          CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS -lmetatomic -lmetatensor"
        make -j2
    - name: Check explicit gradients
      run: |
        source sourceme.sh
        make -C regtest/metatomic
        test -f regtest/metatomic/rt-core-per-atom/tmp/check
        if grep -E 'FAILURE|NOT_APPLICABLE' regtest/metatomic/rt-*/report.txt; then
          exit 1
        fi
    - name: Check one Python runtime in both plugin load orders
      run: |
        source sourceme.sh
        python -m pip install ./plugins/pycv --config-settings="cmake.define.Python_EXECUTABLE=$PYTHON_BIN"
        PLUMED_METATOMIC_TEST_PYCV=1 make -C regtest/metatomic/rt-core-per-atom
        test -f regtest/metatomic/rt-core-per-atom/tmp/check
        if grep -E 'FAILURE|NOT_APPLICABLE' regtest/metatomic/rt-core-per-atom/report.txt; then
          exit 1
        fi
