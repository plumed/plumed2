name: GPU modules and plugins

# The GPU code on runners without a GPU: it is compiled, and the tests that do not need a GPU
# are run (loading, input errors, the error when there is no GPU). The kernels themselves need
# a real GPU.
#
# The gpu_cuda_hip and gpu_voronoi modules (toolchain: cuda) are compiled with more than one
# version of the CUDA toolkit, taken from conda-forge (no driver is needed to compile), in two
# ways: built into the kernel (./configure --enable-modules=+gpu_cuda_hip+gpu_voronoi), and as
# extensions built against an installed kernel without CUDA (./configure --with-extension-base,
# the conda route). gpu_voronoi uses only the headers of gpu_cuda_hip (include: in module.yml):
# its extension must not link gpu_cuda_hip, and it is also built into a kernel without
# gpu_cuda_hip. Both are also compiled into the kernel with HIP (AMD GPUs), with the oldest and
# the newest supported ROCm versions, taken from the apt repository of AMD.

on:
  workflow_call:

permissions:
  contents: read

env:
  PLUMED_STACK_TRACE: yes
  CC: gcc
  CXX: g++

jobs:
  gpu_cuda_hip:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLUMED_CCACHE_SIZE: 200M
      # the oldest and the newest CUDA versions that are tested (conda-forge cuda-version)
      CUDA_VERSIONS: "12.9 13.5"
      MICROMAMBA_VERSION: 2.0.5
    steps:
    - uses: actions/checkout@v6
    - name: Identify runner image
      id: image
      run: echo "os=${ImageOS:?ImageOS is not set}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-reset1-${{ steps.image.outputs.os }}-gpuplugins-hash-${{ github.sha }}
        restore-keys: ccache-reset1-${{ steps.image.outputs.os }}-gpuplugins-hash-
    - name: setup the CI environment
      uses: ./.github/actions/linux-setup
      with:
        ccache: true
        # PLUMED with MPI, as on the clusters: the .cu files are compiled with nvcc -ccbin mpic++,
        # and the headers of PLUMED they include then include mpi.h
        mpi: true

    - name: Build and install PLUMED without CUDA
      # the base of the extensions: the kernel has no CUDA
      # CXX="ccache mpic++" also checks that cuda-flags removes ccache from nvcc -ccbin
      run: |
        ccache -s -M "$PLUMED_CCACHE_SIZE"
        ./configure CXX="ccache $CXX" --disable-dependency-tracking --disable-doc --disable-python --disable-libsearch --prefix="$HOME/opt"
        make -j 4
        make install
        ccache -s -M "$PLUMED_CCACHE_SIZE"

    - name: Install the CUDA toolkits
      # only the compiler, the runtime and CCCL (thrust, cub)
      # micromamba sometimes aborts while downloading ("Unexpected error 9 on netlink descriptor",
      # a failed DNS lookup during the parallel downloads): each environment is tried up to three
      # times. The packages already downloaded stay in the package cache, so a retry is quick.
      run: |
        mkdir -p "$HOME/micromamba"
        curl -fsSL --retry 5 --retry-all-errors \
          "https://conda.anaconda.org/conda-forge/linux-64/micromamba-${MICROMAMBA_VERSION}-0.tar.bz2" \
          | tar -xj -C "$HOME/micromamba" bin/micromamba
        export MAMBA_ROOT_PREFIX="$HOME/micromamba/root"
        for v in $CUDA_VERSIONS ; do
          for attempt in 1 2 3 ; do
            if "$HOME/micromamba/bin/micromamba" create -y -q -p "$HOME/cuda-$v" -c conda-forge \
              cuda-version=$v cuda-nvcc-impl cuda-cudart-dev cuda-cccl ; then
              break
            fi
            echo "::warning::micromamba failed for CUDA $v (attempt $attempt)"
            rm -rf "$HOME/cuda-$v"
            test "$attempt" = 3 && exit 1
            sleep 10
          done
          "$HOME/cuda-$v/bin/nvcc" --version
        done
        python3 -m pip install -r extensions/requirements.txt

    - name: Build gpu_cuda_hip and gpu_voronoi as extensions and run the tests that do not need a GPU
      run: |
        export PATH="$HOME/opt/bin:$PATH"
        export LD_LIBRARY_PATH="$HOME/opt/lib:${LD_LIBRARY_PATH:-}"
        git worktree add "$HOME/ext-src" HEAD
        path0="$PATH"
        ld0="$LD_LIBRARY_PATH"
        for v in $CUDA_VERSIONS ; do
          echo "::group::CUDA $v, extension"
          export PATH="$HOME/cuda-$v/bin:$path0"
          # the shared CUDA runtime of the toolkit, as in the conda packages
          export LD_LIBRARY_PATH="$HOME/cuda-$v/lib:$HOME/cuda-$v/targets/x86_64-linux/lib:$ld0"
          (
            cd "$HOME/ext-src"
            rm -rf _extensions "$HOME/ext-$v"
            # no GPU on the runner: an explicit architecture
            NVCCFLAGS=-arch=sm_80 ./configure --with-extension-base="$HOME/opt" \
              --enable-extension-modules=gpu_cuda_hip:gpu_voronoi --prefix="$HOME/ext-$v"
            make
            make install
          )
          for module in gpu_cuda_hip gpu_voronoi ; do
            library="$HOME/ext-$v/lib/libplumed-ext-$module.so"
            readelf -d "$library" | grep -E 'NEEDED|FLAGS'
            readelf -d "$library" | grep -q 'NEEDED.*libcudart\.so'
            readelf -d "$library" | grep -q 'NODELETE'
            grep -qx "variant cuda$v" "$HOME/ext-$v/lib/plumed/plugins/$module.plumed"
          done
          # gpu_voronoi uses only the headers of gpu_cuda_hip: it neither links nor requires it
          if readelf -d "$HOME/ext-$v/lib/libplumed-ext-gpu_voronoi.so" | grep -q 'gpu_cuda_hip' ; then exit 1 ; fi
          grep -qx "requires " "$HOME/ext-$v/lib/plumed/plugins/gpu_voronoi.plumed"
          export PLUMED_PLUGIN_PATH="$HOME/ext-$v/lib/plumed/plugins"
          plumed modules -q --has gpu_cuda_hip gpu_voronoi
          plumed modules --module gpu_cuda_hip --has-feature cuda -q
          plumed modules --module gpu_voronoi --has-feature cuda -q
          for module in gpu_cuda_hip gpu_voronoi ; do
            make -C regtest/$module clean
            make -C regtest/$module
            .ci/check-nogpu-regtests regtest/$module
          done
          unset PLUMED_PLUGIN_PATH
          echo "::endgroup::"
        done

    - name: Build PLUMED with gpu_cuda_hip and gpu_voronoi in the kernel and run the tests that do not need a GPU
      run: |
        path0="$PATH"
        for v in $CUDA_VERSIONS ; do
          echo "::group::CUDA $v, in the kernel"
          export PATH="$HOME/cuda-$v/bin:$path0"
          # make does not rebuild an object when only the compiler changes: without a clean, the
          # objects of the previous build (the kernel without CUDA, or the previous CUDA version)
          # are linked as they are. The C++ files come from ccache, so the clean costs little.
          make clean
          ./configure CXX="ccache $CXX" --disable-dependency-tracking --disable-doc --disable-python --disable-libsearch \
            --enable-modules=+gpu_cuda_hip+gpu_voronoi NVCCFLAGS=-arch=sm_80
          make -j 4
          # static CUDA runtime: the kernel does not need the CUDA libraries, and is never unloaded
          # (a command negated with ! never stops the step, even when it fails: if ... exit 1 instead)
          readelf -d src/lib/libplumedKernel.so | grep -E 'NEEDED|FLAGS'
          if readelf -d src/lib/libplumedKernel.so | grep -q 'NEEDED.*libcudart' ; then exit 1 ; fi
          readelf -d src/lib/libplumedKernel.so | grep -q 'NODELETE'
          (
            source sourceme.sh
            for module in gpu_cuda_hip gpu_voronoi ; do
              make -C regtest/$module clean
              make -C regtest/$module
              .ci/check-nogpu-regtests regtest/$module
            done
          )
          echo "::endgroup::"
        done
        ccache -s -M "$PLUMED_CCACHE_SIZE"

    - name: Build PLUMED with gpu_voronoi alone in the kernel
      # gpu_voronoi uses the headers of gpu_cuda_hip, that is not built: only the test that does
      # not need a GPU runs (the GPU tests need gpu_cuda_hip, for plumed cuda-devices)
      run: |
        v=${CUDA_VERSIONS##* }
        export PATH="$HOME/cuda-$v/bin:$PATH"
        make clean
        ./configure CXX="ccache $CXX" --disable-dependency-tracking --disable-doc --disable-python --disable-libsearch \
          --enable-modules=+gpu_voronoi NVCCFLAGS=-arch=sm_80
        make -j 4
        (
          source sourceme.sh
          plumed config module gpu_voronoi
          if plumed config module gpu_cuda_hip ; then exit 1 ; fi
          make -C regtest/gpu_voronoi/rt-nogpu-no-gpu clean
          make -C regtest/gpu_voronoi/rt-nogpu-no-gpu
          if grep -e FAILURE -e NOT_APPLICABLE -e "SKIP_ON_CI found!" regtest/gpu_voronoi/rt-nogpu-no-gpu/report.txt ; then exit 1 ; fi
        )
        ccache -s -M "$PLUMED_CCACHE_SIZE"

  gpu_cuda_hip-hip:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # the oldest (see the page of the module) and the newest ROCm versions that are tested
        rocm: ["6.2.4", "7.2.4"]
    env:
      PLUMED_CCACHE_SIZE: 100M
      # no GPU on the runner: the code is compiled for MI250 and MI300 (64-wide wavefronts)
      # and for Radeon RX 7900 (32-wide wavefronts)
      HIP_ARCHITECTURES: "gfx90a gfx942 gfx1100"
    steps:
    - uses: actions/checkout@v6
    - name: Identify runner image
      id: image
      run: echo "os=${ImageOS:?ImageOS is not set}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-reset1-${{ steps.image.outputs.os }}-gpuplugins-hip${{ matrix.rocm }}-hash-${{ github.sha }}
        restore-keys: |
          ccache-reset1-${{ steps.image.outputs.os }}-gpuplugins-hip${{ matrix.rocm }}-hash-
          ccache-reset1-${{ steps.image.outputs.os }}-gpuplugins-hash-
    - name: setup the CI environment
      uses: ./.github/actions/linux-setup
      with:
        ccache: true
        # PLUMED with MPI, as in the CUDA job: hipcc does not use mpic++, so configure
        # asks mpic++ where mpi.h is
        mpi: true

    - name: Install ROCm ${{ matrix.rocm }}
      # only the HIP compiler and runtime, rocThrust, rocPRIM and hipCUB
      run: |
        sudo mkdir --parents --mode=0755 /etc/apt/keyrings
        wget -q https://repo.radeon.com/rocm/rocm.gpg.key -O - | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${{ matrix.rocm }} noble main" \
          | sudo tee /etc/apt/sources.list.d/rocm.list
        printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends rocm-hip-runtime-dev rocthrust-dev rocprim-dev hipcub-dev
        /opt/rocm/bin/hipcc --version

    - name: Build PLUMED with gpu_cuda_hip and gpu_voronoi (HIP) in the kernel and run the tests that do not need a GPU
      run: |
        export PATH="/opt/rocm/bin:$PATH"
        export LD_LIBRARY_PATH="/opt/rocm/lib:${LD_LIBRARY_PATH:-}"
        ccache -s -M "$PLUMED_CCACHE_SIZE"
        ./configure CXX="ccache $CXX" --disable-dependency-tracking --disable-doc --disable-python --disable-libsearch \
          --enable-modules=+gpu_cuda_hip+gpu_voronoi --enable-hip --prefix="$HOME/opt"
        make -j 4
        make install
        ccache -s -M "$PLUMED_CCACHE_SIZE"
        readelf -d src/lib/libplumedKernel.so | grep -E 'NEEDED|FLAGS'
        readelf -d src/lib/libplumedKernel.so | grep -q 'NEEDED.*libamdhip64'
        export PATH="$HOME/opt/bin:$PATH"
        for module in gpu_cuda_hip gpu_voronoi ; do
          make -C regtest/$module
          .ci/check-nogpu-regtests regtest/$module
        done
        # the program of the GPU checks (plugins/openaccPTM/gpucheck) is only compiled: running it needs GPUs
        make -C plugins/openaccPTM/gpucheck USE_HIP=1 device_check
