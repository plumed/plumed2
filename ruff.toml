exclude = [
  # the inputs of the regtests, except those of pycv (see regtest/pycv/ruff.toml)
 "./regtest/*/rt-*"
]

#unlike with clang-format I was promised that the formattation rules behaviour should not change between ruff versions
line-length=88
indent-width=4
target-version="py310"

[lint]
ignore=[ "E741" ]
