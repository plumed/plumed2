name: cudaCoord
authors: Daniele Rapetti 
description: version of coordination number that can run on the GPU with parallelism written in CUDA
dois: []
nlessons: 2
searchterm: cuda

# Packaging options: see conda/module-options.md.
# The recipe supplies compiler('cuda') in build, with the selected CUDA variant.
conda:
  requirements:
    host:
    - spec: cuda-cudart-dev
      selector: linux
    - spec: cuda-cccl
      selector: linux
    run:
    - spec: cuda-cudart
      selector: linux
    test:
    - python
  platforms:
  - linux-64
  - linux-aarch64
  variants:
    cuda_compiler:
    - cuda-nvcc
    cuda_compiler_version:
    - '12.9'
    - '13.0'
    cxx_compiler_version:
    - '14'
    c_stdlib:
    - sysroot
    c_stdlib_version:
    - '2.28'
  tests:
    commands:
    - python extensions/tests/cuda_coordination.py --prefix "$PREFIX" --cuda-version
      "{{ cuda_compiler_version }}"
    source_files:
    - extensions/tests/cuda_coordination.py
    - plugins/cudaCoord/regtest/cudatest/rt-double-nopbc
    - plugins/cudaCoord/regtest/cudatest/rt-float-nopbc
    - plugins/cudaCoord/regtest/trajectories/traj-nopbc.xyz
    - regtest/scripts
