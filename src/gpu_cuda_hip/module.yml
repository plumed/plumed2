name: gpu_cuda_hip
type: default-off
use: [core, tools, cltools]
toolchain: cuda
authors: Daniele Rapetti
description: actions that run on NVIDIA GPUs (CUDA) and AMD GPUs (HIP), with the CUDA/HIP code they share
dois: []
# the PLUMED school lessons that use these actions (searched with searchterm)
nlessons: 2
searchterm: cuda

# Packaging options: see conda/module-options.md.
# Always an extension in conda (one package per CUDA version, on the GPU-independent base).
# The recipe supplies compiler('cuda') in build, with the selected CUDA variant.
conda:
  requirements:
    host:
    - spec: cuda-cudart-dev
      selector: linux
    - spec: cuda-cccl
      selector: linux
    run:
    - spec: cuda-cudart
      selector: linux
    test: [python]
  platforms: [linux-64, linux-aarch64]
  variants:
    cuda_compiler: [cuda-nvcc]
    cuda_compiler_version: ['12.9', '13.0']
    cxx_compiler_version: ['14']
    c_stdlib: [sysroot]
    c_stdlib_version: ['2.28']
  tests:
    commands: ['python extensions/tests/gpu_cuda_hip.py --prefix "$PREFIX" --cuda-version
        "{{ cuda_compiler_version }}"']
    source_files: [extensions/tests/gpu_cuda_hip.py, regtest/gpu_cuda_hip/rt-double-nopbc,
      regtest/gpu_cuda_hip/rt-float-nopbc, regtest/gpu_cuda_hip/trajectories/traj-nopbc.xyz,
      regtest/scripts]
