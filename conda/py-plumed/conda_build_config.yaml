CONDA_BUILD_SYSROOT:
  - /opt/MacOSX10.13.sdk   # [osx and x86_64]
  - /opt/MacOSX11.0.sdk   # [osx and arm64]
python:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"

# Use a declared sysroot rather than the build runner glibc.
c_stdlib:  # [linux]
  - sysroot  # [linux]
c_stdlib_version:  # [linux]
  - "2.28"  # [linux]
