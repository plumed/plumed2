[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "Cython==3.2.4; python_version < '3.15'",
    "Cython==3.3.1; python_version >= '3.15'",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
# {package} is the extracted sdist; {project} is the directory where cibuildwheel runs
test-command = "python {package}/test/test_bundled_wheel.py {package}/plumed_source"
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
