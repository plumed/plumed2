[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "Cython==3.2.4; python_version < '3.15'",
    "Cython==3.3.1; python_version >= '3.15'",
    # the kernel is built with CMake on Windows (see build_backend.py)
    "cmake>=3.18; sys_platform == 'win32'",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip = ["*-win32", "*-win_arm64", "*-manylinux_i686", "*-musllinux*"]
# {package} is the extracted sdist; {project} is the directory where cibuildwheel runs
test-command = [
    "python {package}/test/test_action_description_generators.py",
    "python {package}/test/test_vim_make.py",
    "python {package}/test/test_input_builder.py",
    "python {package}/test/test_io.py",
    "python {package}/test/test_runtime_resources.py",
    "python {package}/test/test_cmd_types.py",
    "python {package}/test/test_unicode_paths.py",
    "python {package}/test/test_hdf5.py",
    "python {package}/test/test_bundled_wheel.py {package}/plumed_source",
]
# h5py and pandas for test_hdf5.py (skipped without them); only binary
# packages (PIP_ONLY_BINARY below), which may lag behind new Python versions
test-requires = [
    "numpy; python_version < '3.15'",
    "pandas; python_version < '3.15'",
    "h5py; python_version < '3.15'",
]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
# The PLUMED kernel does not depend on the Python version: build it once per
# platform and reuse it for all the wheels (see build_backend.py).
# Set PLUMED_BUILD_VERBOSE=1 to see the full output of the build.
# zlib, HDF5 and chemfiles are built once per platform, and linked statically
# in the kernel (see build_dependencies.py)
before-all = "python {package}/build_dependencies.py /tmp/plumed-dependencies"
environment = { PLUMED_RUNTIME_CACHE = "/tmp/plumed-runtime-cache", PLUMED_DEPENDENCIES = "/tmp/plumed-dependencies", PIP_ONLY_BINARY = "numpy,pandas,h5py" }

[tool.cibuildwheel.linux]
# in the manylinux container, before any python version is chosen
before-all = "/opt/python/cp312-cp312/bin/python {package}/build_dependencies.py /tmp/plumed-dependencies"
# the manylinux2014 container (glibc 2.17) has no binary numpy, pandas and h5py
# for Python 3.14 (their wheels require manylinux_2_28)
test-requires = [
    "numpy; python_version < '3.14'",
    "pandas; python_version < '3.14'",
    "h5py; python_version < '3.14'",
]

[tool.cibuildwheel.macos]
# the macos environment replaces the global one, so the cache is set again here
before-all = "python3 {package}/build_dependencies.py /tmp/plumed-dependencies"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15", PLUMED_RUNTIME_CACHE = "/tmp/plumed-runtime-cache", PLUMED_DEPENDENCIES = "/tmp/plumed-dependencies", PIP_ONLY_BINARY = "numpy,pandas,h5py" }

[tool.cibuildwheel.windows]
# the kernel is built with CMake and Visual Studio (see build_backend.py);
# the C++ runtime is linked statically, so no DLL has to be added to the wheel
before-all = "python {package}/build_dependencies.py C:/plumed-dependencies"
environment = { PLUMED_RUNTIME_CACHE = "C:/plumed-runtime-cache", PLUMED_DEPENDENCIES = "C:/plumed-dependencies", PIP_ONLY_BINARY = "numpy,pandas,h5py" }
